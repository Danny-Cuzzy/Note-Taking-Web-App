<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/styles.css" />
        <link rel="stylesheet" href="./css/modal.css" />
        <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-bold-rounded/css/uicons-bold-rounded.css"/>
        <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css" />
        <title>Note Taking App</title>
    </head>

    <body>
        <div class="wrapper">
            <div id="myModal" class="modal">
                <div class="title">
                    <h2>Create a Note</h2>
                    <span class="close">&times;</span>
                </div>
                
                <form action="" class="modalform" id="modalForm">
                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" id="titleInput" name="title" required />
                        <button id="createBtn" onclick="addNote()">Create</button>
                    </div>
                    <textarea name="" id="noteInput"></textarea>
                </form>
            </div>


            <nav class="sidebar">
                <h2><img src="./images/quill.png" alt=""/> Notes</h2>
                <div>
                    <button value="allNotes" id="allNotes"><i class="fi fi-rr-home"></i> All Notes</button>
                    <button value="archivedNotes" id="archivedNotes" onclick="toggleArchived(event)"><i class="fi fi-rr-folder-download"></i>Archived Notes</button>
                </div>
                <hr />
            </nav>

            <section>
                <header>
                    <h2>All Notes</h2>
                    <div class="container">
                        <div class="search-wrapper">
                            <i class="fi fi-rr-search"></i>
                            <input type="search" name="searchInput" id="searchInput" placeholder="Search by title, content, or tags..."/>
                        </div>
                        <i class="fi fi-rr-settings"></i>

                        <label class="switch">
                            <input type="checkbox" onclick="toggleDarkMode()">
                            <span class="slider round"></span>
                        </label>

                    </div>
                </header>


                <main>
                    <nav class="notesList"> 
                        <button class="create-note" id="createNote">+ Create New Note</button> 
                        <ul id="titleList"></ul>                       
                    </nav>

                    <form id="form"></form>

                    <nav class="notesAct">
                        <div>
                            <button value="archive" id="archiveBtn"><i class="fi fi-rr-folder-download"></i>Archive/Unarchive</button> 
                            <button value="delete" id="deleteBtn"><i class="fi fi-rr-trash"></i>Delete Note</button>
                        </div>
                    </nav>

                </main>
            </section>
        </div>
        <script src="./js/script.js"></script>
    </body>
</html>
